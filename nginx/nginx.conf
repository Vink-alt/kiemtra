worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # An phien ban Nginx va Express
    server_tokens off;
    proxy_hide_header X-Powered-By;

    # Dinh dang log truy cap chi tiet phuc vu Promtail va Loki
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main_ext;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gioi han kich thuoc tai len: 3m (dap ung anh xe 2 MB + form data)
    client_max_body_size 3m;

    # Temp paths cho non-root unprivileged container
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Nen Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cau hinh SSL/TLS toan cuc (Chi TLS 1.2 va TLS 1.3)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Gioi han toc do yeu cau (Rate Limiting) chong Brute Force vao trang dang nhap
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_status 429;

    # Upstreams cho cac dich vu noi bo
    upstream backend_web {
        server web:3000;
        keepalive 32;
    }

    upstream backend_pgadmin {
        server pgadmin:80;
        keepalive 8;
    }

    upstream backend_grafana {
        server grafana:3000;
        keepalive 8;
    }

    # =========================================================================
    # Server HTTP (Cong noi bo 8080 -> Host 80) - Chuyen huong 301 sang HTTPS
    # =========================================================================
    server {
        listen 8080;
        listen [::]:8080;
        server_name _;

        # Endpoint giam sat trang thai Nginx noi bo cho Exporter
        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        # Chuyen huong 301 sang HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # Server HTTPS (Cong noi bo 8443 -> Host 443) - Reverse Proxy bao mat
    # =========================================================================
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        server_name _;

        # Duong dan chung chi va khoa rieng tu
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # =====================================================================
        # Security Headers (ap dung voi co always)
        # =====================================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # CSP
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'self';" always;

        # Cau hinh proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Chan truy cap /nginx_status tu ben ngoai qua HTTPS (Hardening)
        location /nginx_status {
            deny all;
            return 404;
        }

        # ---------------------------------------------------------------------
        # Reverse Proxy cho pgAdmin 4 (/pgadmin/)
        # ---------------------------------------------------------------------
        location = /pgadmin {
            return 301 /pgadmin/;
        }

        location /pgadmin/ {
            proxy_pass http://backend_pgadmin/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header X-Scheme $scheme;

            proxy_redirect off;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ---------------------------------------------------------------------
        # Reverse Proxy cho Grafana (/grafana/)
        # ---------------------------------------------------------------------
        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_pass http://backend_grafana;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect off;
        }

        # ---------------------------------------------------------------------
        # Rate Limiting cho endpoint dang nhap (/login)
        # Gioi han 5 req/phut, cho phep burst 5 req khong tre (nodelay)
        # Vuot qua nguong tra ve HTTP 429 Too Many Requests
        # ---------------------------------------------------------------------
        location = /login {
            limit_req zone=login_limit burst=5 nodelay;

            proxy_pass http://backend_web;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect off;
        }

        # ---------------------------------------------------------------------
        # Reverse Proxy cho Web App quan ly doi xe (goc /)
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://backend_web;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect off;
        }
    }
}