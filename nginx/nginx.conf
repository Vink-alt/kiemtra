user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ẩn phiên bản Nginx
    server_tokens off;

    # Định dạng log truy cập chi tiết phục vụ Promtail và Loki
    log_format main_ext '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" '
                        'rt=$request_time uct="$upstream_connect_time" '
                        'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main_ext;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Giới hạn kích thước tải lên: 3m (đáp ứng ảnh xe 2 MB + form data)
    client_max_body_size 3m;

    # Nén Gzip
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Cấu hình SSL/TLS toàn cục
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Upstreams cho các dịch vụ nội bộ
    upstream backend_web {
        server web:3000;
        keepalive 32;
    }

    upstream backend_pgadmin {
        server pgadmin:80;
        keepalive 8;
    }

    # =========================================================================
    # Server HTTP (Cổng 80) - Chuyển hướng 301 toàn bộ sang HTTPS
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Endpoint giám sát trạng thái Nginx nội bộ cho Exporter
        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        # Chuyển hướng 301 sang HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # Server HTTPS (Cổng 443) - Reverse Proxy bảo mật
    # =========================================================================
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        server_name _;

        # Đường dẫn chứng chỉ và khóa riêng tư
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # =====================================================================
        # Security Headers (áp dụng với cờ always)
        # =====================================================================
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        
        # CSP: Cho phép tài nguyên nội bộ, Google Fonts, ảnh Base64 (data: cho QR code) và SVG
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'self';" always;

        # Cấu hình proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Endpoint giám sát trạng thái Nginx nội bộ (Stub Status cho Nginx Exporter ở Bước 4)
        location /nginx_status {
            stub_status;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 192.168.0.0/16;
            deny all;
        }

        # ---------------------------------------------------------------------
        # Reverse Proxy cho pgAdmin 4 dưới đường dẫn /pgadmin/
        # ---------------------------------------------------------------------
        location = /pgadmin {
            return 301 /pgadmin/;
        }

        location /pgadmin/ {
            proxy_pass http://backend_pgadmin/;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Script-Name /pgadmin;
            proxy_set_header X-Scheme $scheme;

            proxy_redirect off;

            # Hỗ trợ WebSockets cho pgAdmin Query Tool
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ---------------------------------------------------------------------
        # Reverse Proxy cho Grafana (Sẵn sàng cho Bước 4 - Giữ comment theo yêu cầu)
        # ---------------------------------------------------------------------
        # location /grafana/ {
        #     proxy_pass http://grafana:3000/;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        #     proxy_set_header Upgrade $http_upgrade;
        #     proxy_set_header Connection "upgrade";
        # }

        # ---------------------------------------------------------------------
        # Reverse Proxy cho Web App quản lý đội xe (gốc /)
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://backend_web;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_redirect off;
        }
    }
}
