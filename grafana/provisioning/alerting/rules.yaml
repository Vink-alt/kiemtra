apiVersion: 1

groups:
  - orgId: 1
    name: 'Fleet Security Alerts'
    folder: 'Fleet Monitoring'
    interval: 10s
    rules:
      - uid: fleet-bruteforce-login
        title: 'Fleet - Brute force login'
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: Loki
            model:
              editorMode: code
              expr: sum(count_over_time({job="webapp"} |= "LOGIN_FAILED" [1m]))
              instant: false
              range: true
              refId: A
          - refId: B
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [B]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [5]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [C]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                name: Expression
                type: __expr__
                uid: __expr__
              expression: $B > 5
              refId: C
              type: math
        noDataState: OK
        execErrState: Error
        for: 10s
        annotations:
          summary: "Phat hien tan cong do mat khau (Brute Force) vao ung dung doi xe"
          description: "Co hon 5 lan dang nhap that bai (LOGIN_FAILED) trong vong 1 phut. Huong dan truy vet: Chay LogQL {job=\"webapp\"} |= \"LOGIN_FAILED\" de xac dinh IP va tai khoan bi tan cong, sau do kiem tra {job=\"nginx\"} de chan IP."
        labels:
          severity: critical
          category: security
